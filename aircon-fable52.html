<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>エアコンのしくみ — 3Dで見る冷房と暖房 (ヒートポンプ)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(9px,min(0.9766vw,1.7361vh),30px)}
body{height:100vh;overflow:hidden;background:#070d18;color:#e8eef8;font-size:1rem;line-height:1.45;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none}
#app{display:grid;grid-template-columns:minmax(0,1fr) 28rem;height:100vh}
#stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column}
#view{position:relative;flex:1;min-height:0;overflow:hidden;
  background:radial-gradient(120% 95% at 42% 38%,#1c2d49 0%,#0d1729 58%,#070d18 100%)}
#gl{position:absolute;left:0;top:0;width:100%;height:100%;display:block;outline:none}
#leaders{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#leaders line{stroke:rgba(205,222,250,.6);stroke-width:1}
#leaders circle{fill:#fff;stroke:rgba(10,18,32,.9);stroke-width:1}
#labels{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

/* ---- 3D上のラベル ---- */
.lbl{position:absolute;left:0;top:0;width:max-content;max-width:15.5rem;padding:.2rem .5rem .26rem;
  background:rgba(10,18,33,.88);border:1px solid #3b4f73;border-radius:.45rem;font-size:.84rem;line-height:1.32;
  color:#c2cfe3;pointer-events:auto;visibility:hidden;white-space:normal}
.lbl.part{cursor:pointer}
.lbl.part:hover{border-color:#8fb6ff}
.lbl b{font-size:.96rem;color:#fff;white-space:nowrap}
.lbl .tag{display:inline-block;margin-left:.35rem;padding:0 .38rem;border-radius:.3rem;font-size:.82rem;font-weight:700;white-space:nowrap;color:#fff}
.tag.abs{background:#1479c9}
.tag.rel{background:#d2491c}
.lbl .d{display:block}
.lbl.compact .d{display:none}
.lbl.st{white-space:nowrap;border-color:var(--c);color:#fff;padding:.12rem .5rem .16rem .3rem;border-radius:1rem;font-size:.86rem}
.lbl.st .n{color:var(--c);font-weight:700;font-size:1.05rem;margin-right:.15rem}
.lbl.air{white-space:nowrap;border-style:dashed;border-color:#6c7f9f;color:#e8eef8;padding:.1rem .5rem .14rem;font-size:.86rem}
.lbl.air i{display:inline-block;width:.62rem;height:.62rem;border-radius:50%;margin-right:.3rem;background:var(--c)}
.hot{--c:#ff3b4b}.warm{--c:#ff8a2b}.cold{--c:#2bb4ff}.cool{--c:#4fdcec}

/* ---- 圧縮機の断面 (別視点) ---- */
#inset{position:absolute;left:.6rem;top:.6rem;width:16.4rem;border:1px solid #3b4f73;border-radius:.55rem;overflow:hidden;
  box-shadow:0 .3rem 1rem rgba(0,0,0,.45)}
#inset .ititle{background:#13223b;padding:.22rem .55rem .25rem;font-size:.92rem;font-weight:700;white-space:nowrap}
#inset .ititle span{font-weight:400;color:#9fb0c8;font-size:.82rem;margin-left:.3rem}
#insetView{position:relative;width:100%;height:16.4rem;border-top:1px solid #2a3b5a;border-bottom:1px solid #2a3b5a}
#insetView svg{position:absolute;left:0;top:0;width:100%;height:100%}
#insetView svg line{stroke:rgba(205,222,250,.7);stroke-width:1}
.il{position:absolute;font-size:.82rem;line-height:1.2;padding:.05rem .32rem .1rem;border-radius:.3rem;background:rgba(10,18,33,.85);border:1px solid #3b4f73;white-space:nowrap}
#inset .icap{background:#101c31;padding:.25rem .55rem .32rem;font-size:.82rem;line-height:1.4;color:#c2cfe3}
#inset .icap div{white-space:nowrap}
.sw{display:inline-block;width:.7rem;height:.7rem;border-radius:.15rem;margin:0 .22rem 0 0;vertical-align:-.05rem}
#insetP b{color:#fff;font-variant-numeric:tabular-nums}

/* ---- 下のバー ---- */
#bar{flex:none;padding:.42rem .8rem .5rem;background:#0b1424;border-top:1px solid #22324d;display:flex;flex-direction:column;gap:.38rem;font-size:.88rem}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:.3rem 1.1rem}
.grp{display:flex;align-items:center;gap:.3rem;white-space:nowrap}
.grp>span.k{color:#9fb0c8;margin-right:.1rem}
button{font:inherit;color:#dfe8f5;background:#17243a;border:1px solid #33486b;border-radius:.4rem;padding:.14rem .6rem .18rem;cursor:pointer;white-space:nowrap}
button:hover{border-color:#7da6e8}
button.on{background:#2b5fb8;border-color:#7fb0ff;color:#fff}
input[type=range]{width:6.5rem;accent-color:#6ea2ff}
.lg{display:flex;align-items:center;gap:.35rem;white-space:nowrap;color:#c2cfe3}
.tbar{display:inline-block;width:9rem;height:.62rem;border-radius:.3rem;border:1px solid #3b4f73}
.dotS{display:inline-block;width:.42rem;height:.42rem;border-radius:50%;background:#bfe6ff}
.dotL{display:inline-block;width:.78rem;height:.78rem;border-radius:50%;background:#2bb4ff}
.arw{display:inline-block;width:0;height:0;border-top:.36rem solid transparent;border-bottom:.36rem solid transparent;border-left:.8rem solid #ffe45e}
.pp{display:inline-block;width:1.5rem;height:.42rem;border-radius:.2rem}

/* ---- 右の説明パネル ---- */
#side{background:#0e1829;border-left:1px solid #22324d;padding:.8rem 1rem .7rem;display:flex;flex-direction:column;gap:.5em;overflow:hidden;min-height:0;font-size:1rem}
#side h1{font-size:1.42em;line-height:1.25;letter-spacing:.02em}
#side h1 small{display:block;font-size:.62em;font-weight:400;color:#9fb0c8;margin-top:.1em}
#modeSw{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
#modeSw button{padding:.32em 0 .38em;font-size:1.1em;font-weight:700}
#modeSw button[data-mode=cool].on{background:#1177cc;border-color:#7fd0ff}
#modeSw button[data-mode=heat].on{background:#d2551f;border-color:#ffb894}
#lead{font-size:.93em;color:#dbe6f5;line-height:1.45}
#lead b{color:#fff}
#steps{list-style:none;display:flex;flex-direction:column;gap:.22em}
.step{border:1px solid #263755;border-radius:.5em;background:#121f35;padding:.3em .6em .38em;cursor:pointer}
.step:hover{border-color:#7da6e8}
.step h3{font-size:1em;display:flex;align-items:center;gap:.5em;line-height:1.4}
.step h3 i{font-style:normal;font-size:.82em;font-weight:700;padding:0 .45em;border-radius:.3em;color:#fff;white-space:nowrap}
.role-work{background:#8a6a12}.role-rel{background:#d2491c}.role-exp{background:#6b4fc0}.role-abs{background:#1479c9}
.step p{font-size:.87em;color:#c3d0e4;line-height:1.42}
.state{display:flex;align-items:center;gap:.55em;font-size:.87em;line-height:1.3;padding:.02em 0 .02em .7em;margin-left:1.1em;border-left:.2em solid var(--c);white-space:nowrap}
.state .n{color:var(--c);font-weight:700;font-size:1.25em}
.state b{color:#fff}
.state span.v{color:#dbe6f5}
#balance{border:1px dashed #556a8d;border-radius:.5em;padding:.3em .6em .36em;font-size:.88em;line-height:1.4;color:#e8eef8}
#balance em{font-style:normal;color:#ffd166;font-weight:700}
#note{font-size:.8em;color:#8fa1bb;line-height:1.4}
</style>

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

</head>
<body>
<div id="app">
  <main id="stage">
    <div id="view">
      <canvas id="gl"></canvas>
      <svg id="leaders"></svg>
      <div id="labels"></div>
      <div id="inset">
        <div class="ititle">圧縮機の中<span>上から見た断面</span></div>

          <svg id="insetSvg"></svg>
          <span class="il" id="ilD">吐出口</span>
          <span class="il" id="ilS">吸入口</span>
        </div>
        <div class="icap">
          <div><span class="sw" style="background:#e9c349"></span>ベーン (仕切り板)　<span class="sw" style="background:#c9d2de;border-radius:50%"></span>偏心して回るローラー</div>
          <div id="insetP">圧縮室の圧力 <b>-</b></div>
        </div>
      </div>
    </div>
    <div id="bar">
      <div class="row">
        <span class="lg">色＝温度 <span>−10℃</span><span class="tbar" id="tbar"></span><span>90℃</span></span>
        <span class="lg"><span class="dotS"></span>小さく淡い粒＝気体の冷媒</span>
        <span class="lg"><span class="dotL"></span>大きい粒＝液体の冷媒</span>
        <span class="lg"><span class="arw"></span>矢じり＝空気の流れ</span>
        <span class="lg">配管 <span class="pp" style="background:#d9764a"></span>高圧側 <span class="pp" style="background:#4f8fe0"></span>低圧側</span>
      </div>
      <div class="row">
        <div class="grp" id="viewBtns"><span class="k">視点</span>
          <button data-view="all" class="on">全体</button><button data-view="iu">室内機</button><button data-view="ou">室外機</button><button data-view="comp">圧縮機</button><button data-view="valve">四方弁・膨張弁</button></div>
        <div class="grp" id="caseBtns"><span class="k">外装</span>
          <button data-case="glass" class="on">透かす</button><button data-case="none">外す</button><button data-case="solid">付ける</button></div>
        <div class="grp"><button id="lblBtn" class="on">名前を表示</button><button id="pauseBtn">一時停止</button></div>
        <div class="grp"><span class="k">速さ</span><input id="speed" type="range" min="0.2" max="2.5" step="0.1" value="1" aria-label="アニメーションの速さ"></div>
        <div class="grp"><span class="k">ドラッグ: 回転 ／ ホイール: 拡大</span></div>
      </div>
    </div>
  </main>
  <aside id="side">
    <h1>エアコンのしくみ<small>冷媒が熱を運ぶ「ヒートポンプ」を3D模型で見る</small></h1>
    <div id="modeSw"><button data-mode="cool">冷房</button><button data-mode="heat">暖房</button></div>
    <p id="lead"></p>
    <ol id="steps"></ol>
    <div id="balance"></div>
    <p id="note">数値は冷媒R32の代表例 (冷房: 外気35℃・室温27℃／暖房: 外気7℃・室温20℃)。1MPa≒10気圧。回転や流れは実物よりゆっくり表示。</p>
  </aside>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V3 = THREE.Vector3, TAU = Math.PI * 2, DEG = Math.PI / 180;

const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

const $ = s => document.querySelector(s);

/* =====================================================================
   説明テキスト
   ===================================================================== */
const SAME_COMP = '気体の冷媒をせまい空間に押し縮める。気体は圧縮されると圧力も温度も上がる (自転車の空気入れが熱くなるのと同じ)。';
const SAME_EXP = '細いすき間を通ると圧力が急に下がる。沸点が下がって一部が蒸発し、その気化熱で冷媒自身が冷える。';
const TXT = {
  cool: {
    lead: '<b>冷房</b>は冷たさを作るのではなく、<b>室内の熱を冷媒に吸わせ、屋外へ運んで捨てる</b>しくみ。冷媒は気体⇄液体と姿を変えながら回路を回り続ける。',
    steps: [
      { view: 'comp', name: '圧縮機', role: '圧縮する', rc: 'work', text: SAME_COMP, st: ['hot', '気体', '約80℃', '高圧 約2.8MPa'] },
      { view: 'ou', name: '室外熱交換器', role: '凝縮器｜熱を捨てる', rc: 'rel', text: '冷媒は外気 (35℃) より熱いので、熱は冷媒から外気へ移る。熱を失った気体は液体に変わる (凝縮)。', st: ['warm', '液体', '約40℃', '高圧 約2.8MPa'] },
      { view: 'valve', name: '膨張弁', role: '圧力を下げる', rc: 'exp', text: SAME_EXP, st: ['cold', '液体＋気体', '約10℃', '低圧 約1.1MPa'] },
      { view: 'iu', name: '室内熱交換器', role: '蒸発器｜熱を吸う', rc: 'abs', text: '冷媒は室内の空気 (27℃) より冷たいので、熱は空気から冷媒へ移る。冷媒はその熱で蒸発し、空気は冷えて吹き出す。', st: ['cool', '気体', '約15℃', '低圧 約1.1MPa'] },
    ],
    balance: '<em>熱の収支</em>　室内で吸った熱 ＋ 圧縮機の仕事 (電気) ＝ 屋外へ捨てる熱',
    air: ['室内の空気 27℃', '冷風 約15℃', '外気 35℃', '熱い排気 約42℃'], airT: [27, 15, 35, 43],
  },
  heat: {
    lead: '<b>暖房</b>は四方弁で冷媒の流れを逆にし、<b>冬の外気から熱を吸い、室内へ運んで放出する</b>。熱を作るのではなく運ぶので、使った電気の数倍の熱を届けられる。',
    steps: [
      { view: 'comp', name: '圧縮機', role: '圧縮する', rc: 'work', text: SAME_COMP, st: ['hot', '気体', '約85℃', '高圧 約2.8MPa'] },
      { view: 'iu', name: '室内熱交換器', role: '凝縮器｜熱を出す', rc: 'rel', text: '熱い冷媒が室内の空気 (20℃) に熱を渡し、空気は温風になって吹き出す。熱を失った冷媒は液体に変わる (凝縮)。', st: ['warm', '液体', '約35℃', '高圧 約2.8MPa'] },
      { view: 'valve', name: '膨張弁', role: '圧力を下げる', rc: 'exp', text: SAME_EXP, st: ['cold', '液体＋気体', '約0℃', '低圧 約0.8MPa'] },
      { view: 'ou', name: '室外熱交換器', role: '蒸発器｜熱を吸う', rc: 'abs', text: '冷媒 (約0℃) は冬の外気 (7℃) よりも冷たいので、外気からでも熱が流れこむ。冷媒はその熱で蒸発して気体に戻る。', st: ['cool', '気体', '約5℃', '低圧 約0.8MPa'] },
    ],
    balance: '<em>熱の収支</em>　外気から吸った熱 ＋ 圧縮機の仕事 (電気) ＝ 室内へ出す熱',
    air: ['室内の空気 20℃', '温風 約40℃', '外気 7℃', '冷たい排気 約2℃'], airT: [20, 40, 7, 1],
  },
};
// 冷媒の状態 (温度℃・乾き度) の代表値
const ST = {
  cool: { Td: 80, Tc: 45, Tl: 40, Te: 10, Ts: 15, xf: 0.20, PH: 2.8, PL: 1.1 },
  heat: { Td: 85, Tc: 45, Tl: 35, Te: 0, Ts: 5, xf: 0.22, PH: 2.8, PL: 0.8 },
};
let mode = (new URLSearchParams(location.search).get('mode') || '').toLowerCase() === 'heat' ? 'heat' : 'cool';

/* =====================================================================
   温度 → 色
   ===================================================================== */
const STOPS = [[-10, 0x2a3cff], [0, 0x2f62ff], [5, 0x2f8dff], [10, 0x2bb4ff], [15, 0x35d3f0], [20, 0x8fe8c0], [27, 0xffe45e], [35, 0xffa62b], [45, 0xff5a1f], [60, 0xff3526], [90, 0xff1a4a]];
const LUTN = 201, LUTl = new Float32Array(LUTN * 3), LUTg = new Float32Array(LUTN * 3);
{
  const a = new THREE.Color(), b = new THREE.Color(), w = new THREE.Color(0xffffff);
  for (let i = 0; i < LUTN; i++) {
    const T = -10 + i * 0.5; let k = 0; while (k < STOPS.length - 2 && T > STOPS[k + 1][0]) k++;
    a.setHex(STOPS[k][1]); b.setHex(STOPS[k + 1][1]);
    a.lerp(b, clamp((T - STOPS[k][0]) / (STOPS[k + 1][0] - STOPS[k][0]), 0, 1));
    LUTl[i * 3] = a.r; LUTl[i * 3 + 1] = a.g; LUTl[i * 3 + 2] = a.b;
    a.lerp(w, 0.45);
    LUTg[i * 3] = a.r; LUTg[i * 3 + 1] = a.g; LUTg[i * 3 + 2] = a.b;
  }
  $('#tbar').style.background = 'linear-gradient(90deg,' + STOPS.map(s => '#' + s[1].toString(16).padStart(6, '0') + ' ' + (s[0] + 10) + '%').join(',') + ')';
}
const lutIdx = T => clamp(((T + 10) * 2) | 0, 0, LUTN - 1);
const tempColor = (T, c = new THREE.Color()) => { const i = lutIdx(T) * 3; return c.setRGB(LUTl[i], LUTl[i + 1], LUTl[i + 2]); };

/* =====================================================================
   レンダラー・カメラ
   ===================================================================== */
const view = $('#view'), canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.autoClear = false;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.02, 60);
camera.position.set(1.2, 1.4, 4.2);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.09;
controls.minDistance = 0.18; controls.maxDistance = 9; controls.zoomSpeed = 0.9;

const hemi = new THREE.HemisphereLight(0xe4edff, 0x3a4352, 1.7);
const sun = new THREE.DirectionalLight(0xffffff, 2.3); sun.position.set(2.5, 4, 5);
const fill = new THREE.DirectionalLight(0xbcd0ff, 0.9); fill.position.set(-4, 2.5, -2);
for (const l of [hemi, sun, fill]) { l.layers.enable(1); scene.add(l); }

/* =====================================================================
   形を作る道具
   ===================================================================== */
const std = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.6, metalness: 0.1 }, o));
const glass = (color, opacity, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, transparent: true, opacity, depthWrite: false, side: THREE.DoubleSide, roughness: 0.4, metalness: 0 }, o));
function mesh(geo, mat, parent, pos) { const m = new THREE.Mesh(geo, mat); if (pos) m.position.set(pos[0], pos[1], pos[2]); (parent || scene).add(m); return m; }
const both = o => { o.layers.enable(1); return o; };       // 本体ビューと断面ビューの両方に出す
const insetOnly = o => { o.layers.set(1); return o; };     // 断面ビューだけに出す

// 角を丸めた折れ線
function fillet(pts, r = 0.02, n = 6) {
  const out = [pts[0].clone()];
  for (let i = 1; i < pts.length - 1; i++) {
    const p = pts[i], d1 = p.clone().sub(pts[i - 1]), d2 = pts[i + 1].clone().sub(p);
    const l1 = d1.length(), l2 = d2.length(); d1.normalize(); d2.normalize();
    if (d1.dot(d2) > 0.9995) { out.push(p.clone()); continue; }
    const rr = Math.min(r, l1 * 0.5, l2 * 0.5), A = p.clone().addScaledVector(d1, -rr), B = p.clone().addScaledVector(d2, rr);
    for (let k = 0; k <= n; k++) { const t = k / n; out.push(A.clone().multiplyScalar((1 - t) * (1 - t)).addScaledVector(p, 2 * t * (1 - t)).addScaledVector(B, t * t)); }
  }
  out.push(pts[pts.length - 1].clone());
  return out;
}
// U字ベンド (両端 A,B は含まない)
function uBend(A, B, dir, h, n = 8) {
  const c1 = A.clone().addScaledVector(dir, h), c2 = B.clone().addScaledVector(dir, h), out = [];
  for (let k = 1; k < n; k++) { const t = k / n, s = 1 - t; out.push(A.clone().multiplyScalar(s * s * s).addScaledVector(c1, 3 * s * s * t).addScaledVector(c2, 3 * s * t * t).addScaledVector(B, t * t * t)); }
  return out;
}
function resample(pts, ds) {
  const out = [pts[0].clone()]; let carry = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], L = a.distanceTo(b); if (L < 1e-9) continue;
    let d = ds - carry;
    while (d <= L) { out.push(a.clone().lerp(b, d / L)); d += ds; }
    carry = L - (d - ds);
  }
  const last = pts[pts.length - 1];
  if (out[out.length - 1].distanceTo(last) > ds * 0.3) out.push(last.clone()); else out[out.length - 1].copy(last);
  return out;
}
function splinePts(ctrl, n) { return new THREE.CatmullRomCurve3(ctrl, false, 'centripetal').getSpacedPoints(n); }
// 折れ線に沿った管
