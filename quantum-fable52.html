<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超伝導量子コンピューターのしくみ — 3D アニメーション</title>
<link rel="icon" href="data:,">
<style>
:root{
  --hdr:4.4rem; --pad:.9rem; --panel-w:25rem;
  --rc:calc((100vw - var(--panel-w) - var(--pad)) / 2);
  --gold:#ffd166; --ink:#e9eff9; --sub:#a9b8d0; --card:rgba(11,18,32,.90); --line:rgba(255,255,255,.14);
  --q0:#ffb454; --q1:#5fd0ff; --ent:#ff78d2;
}
*{box-sizing:border-box}
html{font-size:clamp(9px,min(1.1vw,1.95vh),36px)}
html,body{margin:0;height:100%;overflow:hidden;background:#05080f;color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;line-break:strict}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#fade{position:fixed;left:0;top:0;width:100%;height:100%;background:#05080f;opacity:1;pointer-events:none;z-index:1}
#lead{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:hidden}
#lead line{stroke:rgba(255,255,255,.5);stroke-width:1.2}
#lead circle{fill:#fff;stroke:#05080f;stroke-width:1}
#labels{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:hidden}

/* ---- ket |x> drawn with CSS (font independent) ---- */
.ket{display:inline-block;white-space:nowrap}
.ket::before{content:"|";margin-right:.03em}
.ket::after{content:"";display:inline-block;width:.5em;height:.5em;margin:0 -.04em 0 -.2em;
  border-top:.11em solid currentColor;border-right:.11em solid currentColor;
  transform:scaleX(.5) rotate(45deg);vertical-align:.06em}

/* ---- header ---- */
#hdr{position:fixed;left:0;right:0;top:0;height:var(--hdr);display:flex;align-items:center;gap:1rem;padding:0 1rem;
  background:linear-gradient(rgba(6,10,19,.96),rgba(6,10,19,.86));border-bottom:1px solid var(--line);z-index:6;pointer-events:none}
.brand{flex:0 0 auto;white-space:nowrap}
.brand h1{margin:0;font-size:1.16rem;line-height:1.3;letter-spacing:.02em}
.brand p{margin:0;font-size:.72rem;line-height:1.3;color:var(--sub)}
#steps{flex:1 1 auto;display:flex;justify-content:center;gap:.32rem;min-width:0}
.step{pointer-events:auto;position:relative;display:flex;align-items:center;gap:.35rem;height:2.5rem;padding:0 .6rem 0 .4rem;
  border:1px solid rgba(255,255,255,.16);border-radius:.6rem;background:#0f1626;color:#8f9fbb;font:inherit;font-size:.8rem;
  cursor:pointer;overflow:hidden;white-space:nowrap;flex:0 0 auto}
.step .n{flex:0 0 auto;width:1.35rem;height:1.35rem;border-radius:50%;background:#26324a;color:#d5e2f7;display:grid;place-items:center;font-size:.74rem;font-weight:700}
.step.done{color:#cdd8ea}
.step.done .n{background:#6b5a2a;color:#ffe6a6}
.step.on{color:#fff;border-color:var(--gold);background:#1c2439}
.step.on .n{background:var(--gold);color:#16130a}
.step .bar{position:absolute;left:0;bottom:0;height:.2rem;width:0;background:var(--gold)}
#playBtn{pointer-events:auto;flex:0 0 auto;display:flex;align-items:center;gap:.45rem;height:2.5rem;padding:0 .8rem;border:1px solid rgba(255,255,255,.22);
  border-radius:.6rem;background:#141d31;color:#fff;font:inherit;font-size:.8rem;cursor:pointer;white-space:nowrap}
#playBtn i{display:inline-block;width:.75rem;height:.8rem;border-left:.26rem solid #fff;border-right:.26rem solid #fff}
#playBtn.paused i{width:0;height:0;border:0 solid transparent;border-top:.42rem solid transparent;border-bottom:.42rem solid transparent;border-left:.72rem solid #fff}

/* ---- explanation panel ---- */
#panel{position:fixed;right:var(--pad);top:calc(var(--hdr) + var(--pad));bottom:var(--pad);width:var(--panel-w);
  padding:1rem 1.1rem .7rem;background:var(--card);border:1px solid var(--line);border-radius:.9rem;z-index:5;pointer-events:none;
  display:flex;flex-direction:column;overflow:hidden}
.stepno{font-size:.76rem;letter-spacing:.08em;color:var(--gold);font-weight:700}
#pTitle{margin:.15rem 0 .55rem;font-size:1.32rem;line-height:1.35}
.sbody{display:none}
.sbody.show{display:block}
.sbody .leadtx{margin:0 0 .5rem;font-size:.98rem;line-height:1.6;font-weight:700;color:#fff}
.sbody ul{margin:0;padding:0 0 0 1.15rem}
.sbody li{margin:.42rem 0;font-size:.86rem;line-height:1.62;color:#c9d5e8}
.sbody li b{color:#fff}
.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;margin-right:.3rem;vertical-align:-.03rem}
.elv{position:relative;height:7.6rem;margin:.7rem 0 0;border:1px solid var(--line);border-radius:.6rem;background:rgba(255,255,255,.03)}
.elv .lv{position:absolute;left:3.4rem;width:6.2rem;height:0;border-top:.16rem solid #dfe9fb}
.elv .kl{position:absolute;left:1rem;font-size:.95rem;transform:translateY(-50%);font-weight:700}
.elv .ar{position:absolute;left:6.4rem;width:0;border-left:.14rem solid var(--q0)}
.elv .ar.d{border-left:.14rem dashed #8aa0c4}
.elv .tx{position:absolute;left:10.4rem;right:.5rem;font-size:.76rem;line-height:1.4;color:#c9d5e8;transform:translateY(-50%)}
.elv .tx b{color:var(--q0)}

#qcard{margin-top:auto;border:1px solid var(--line);border-radius:.7rem;background:rgba(255,255,255,.035);padding:.6rem .7rem .55rem}
body.phaseA #qcard{display:none}
.qhead{font-size:.8rem;font-weight:700;color:#fff}
.qhead small{font-weight:400;color:var(--sub);font-size:.72rem;margin-left:.3rem}
#formula{margin:.3rem 0 .4rem;font-size:1.08rem;line-height:1.7;white-space:nowrap;color:#fff;height:1.9rem}
.tbl{display:grid;grid-template-columns:2.7rem 1fr 1fr;column-gap:.6rem;row-gap:.28rem;align-items:center}
.tbl .th{font-size:.72rem;color:var(--sub);white-space:nowrap}
.tbl .kc{font-size:.92rem;font-weight:700}
.cell{display:flex;align-items:center;gap:.35rem;min-width:0}
.cell .trk{flex:1 1 auto;height:.75rem;border-radius:.2rem;background:rgba(255,255,255,.09);overflow:hidden}
.cell .trk i{display:block;height:100%;width:0;background:#8fb4ff;border-radius:.2rem}
.cell.c .trk i{background:var(--gold)}
.cell em{flex:0 0 2.7rem;text-align:right;font-style:normal;font-size:.8rem;font-variant-numeric:tabular-nums;color:#fff}
.lenrow{margin-top:.45rem;font-size:.78rem;color:var(--sub);white-space:nowrap}
.lenrow b{font-variant-numeric:tabular-nums}
.lenrow .a0{color:var(--q0)} .lenrow .a1{color:var(--q1)}
.foot{margin-top:.6rem;padding-top:.45rem;border-top:1px solid var(--line);font-size:.72rem;color:#8ea0bd;white-space:nowrap}
body.phaseA .foot{margin-top:auto}

/* ---- leader labels ---- */
.ll{position:absolute;top:0;padding:.28rem .55rem .3rem;border-radius:.45rem;background:rgba(10,17,31,.86);border:1px solid rgba(255,255,255,.16);
  opacity:0;transition:opacity .35s}
.ll.L{left:1rem;width:12.5rem}
.ll.R{right:calc(var(--panel-w) + var(--pad) + 1rem);width:13.5rem}
.ll.vis{opacity:1}
.ll.vis.dim{opacity:.38}
.ll.hot{border-color:var(--gold)}
.ll b{display:block;font-size:.86rem;line-height:1.35;color:#fff;white-space:nowrap}
.ll span{display:block;font-size:.73rem;line-height:1.4;color:var(--sub)}
.ll .tc{display:inline-block;width:.62rem;height:.62rem;border-radius:50%;margin-right:.38rem}

/* ---- caption ---- */
#caption{position:fixed;left:var(--rc);bottom:1rem;transform:translateX(-50%);z-index:4;pointer-events:none;
  padding:.42rem 1.1rem;border-radius:2rem;background:rgba(14,22,40,.93);border:1px solid rgba(255,209,102,.55);
  font-size:.95rem;line-height:1.5;white-space:nowrap;color:#fff}
body.phaseB #caption{bottom:calc(var(--pad) + 9rem + .6rem)}

/* ---- circuit ---- */
#circuit{position:fixed;left:var(--rc);bottom:var(--pad);transform:translateX(-50%);width:40rem;height:9rem;background:var(--card);
  border:1px solid var(--line);border-radius:.9rem;z-index:5;pointer-events:none}
body.phaseA #circuit{visibility:hidden}
#circuit .cl{position:absolute;top:.5rem;font-size:.74rem;color:var(--sub);transform:translateX(-50%);white-space:nowrap}
#circuit .cl.act{color:var(--gold);font-weight:700}
.wire{position:absolute;left:6.4rem;right:6.6rem;height:.14rem;background:#8fa3c4;transform:translateY(-50%)}
.qlab{position:absolute;left:1.1rem;font-size:.95rem;font-weight:700;transform:translateY(-50%);white-space:nowrap}
.qlab.l0{color:var(--q0)} .qlab.l1{color:var(--q1)}
.gate{position:absolute;width:2.3rem;height:2.3rem;transform:translate(-50%,-50%);border:.14rem solid #cfe0ff;border-radius:.35rem;background:#16203a;
  display:grid;place-items:center;font-weight:700;font-size:1.15rem;color:#fff}
.gate svg{width:1.6rem;height:1.6rem;display:block}
.cdot{position:absolute;width:.9rem;height:.9rem;border-radius:50%;background:#cfe0ff;transform:translate(-50%,-50%)}
.cvl{position:absolute;width:.14rem;background:#cfe0ff;transform:translateX(-50%)}
.ctg{position:absolute;width:1.7rem;height:1.7rem;border-radius:50%;border:.14rem solid #cfe0ff;background:#16203a;transform:translate(-50%,-50%)}
.ctg::before,.ctg::after{content:"";position:absolute;left:50%;top:50%;background:#cfe0ff;transform:translate(-50%,-50%)}
.ctg::before{width:100%;height:.14rem}
.ctg::after{width:.14rem;height:100%}
.act.gate,.act.ctg{border-color:var(--gold);box-shadow:0 0 .7rem rgba(255,209,102,.75)}
.act.cdot,.act.cvl{background:var(--gold)}
.act.ctg::before,.act.ctg::after{background:var(--gold)}
.res{position:absolute;width:2rem;height:2rem;transform:translate(-50%,-50%);border:.1rem dashed #7f93b5;border-radius:.35rem;display:grid;place-items:center;
  font-size:1.2rem;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.res.has{border-style:solid;border-color:var(--gold);background:#3a2f12}
#ph{position:absolute;top:1.9rem;bottom:.7rem;left:0;width:.14rem;background:var(--gold);box-shadow:0 0 .5rem var(--gold);transform:translateX(-50%)}

#fatal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;max-width:36rem;padding:1.2rem 1.5rem;border-radius:.8rem;
  background:#1b2236;border:1px solid var(--gold);font-size:1rem;line-height:1.7}
#fatal[hidden]{display:none}
</style>
</head>

/* ================================================================
   2 量子ビットの状態ベクトルの計算 (振幅の順は |q0 q1> = 00, 01, 10, 11)
   ================================================================ */
const cx = (re, im = 0) => [re, im];
const cmul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
const cconj = a => [a[0], -a[1]];
const cabs2 = a => a[0] * a[0] + a[1] * a[1];
// H を q0 にかける途中: 軸 (x+z)/√2 のまわりに角度 π·s 回転 (全体位相は最後に実数になるよう調整)
function stateH(s) {
  const h = Math.PI * s / 2, c = Math.cos(h), sn = Math.sin(h) * Math.SQRT1_2, ph = cx(Math.cos(h), Math.sin(h));
  return [cmul(cx(c, -sn), ph), cx(0), cmul(cx(0, -sn), ph), cx(0)];
}
// CNOT の途中: q0 が |1> の成分だけ、q1 を x 軸まわりに π·s 回転 (s=1 でちょうど CNOT)
function stateCX(s) {
  const f = Math.PI * s / 2, k = Math.SQRT1_2, ph = cx(Math.cos(f), Math.sin(f));
  return [cx(k), cx(0), cmul(cx(k * Math.cos(f)), ph), cmul(cx(0, -k * Math.sin(f)), ph)];
}
// 片方の量子ビットだけを見た状態 (縮約密度行列) のブロッホベクトル
function reduced(st) {
  const [a, b, c, d] = st;
  const o0 = cmul(a, cconj(c)), o0b = cmul(b, cconj(d));
  const o1 = cmul(a, cconj(b)), o1b = cmul(c, cconj(d));
  const r0 = [2 * (o0[0] + o0b[0]), -2 * (o0[1] + o0b[1]), cabs2(a) + cabs2(b) - cabs2(c) - cabs2(d)];
  const r1 = [2 * (o1[0] + o1b[0]), -2 * (o1[1] + o1b[1]), cabs2(a) + cabs2(c) - cabs2(b) - cabs2(d)];
  return { r0, r1, p: st.map(cabs2) };
}

const BELL = stateCX(1);

// 計算の段階 (4〜7) の、時刻 tau での様子をまとめて返す
function quantumAt(si, tau) {
  const q = { st: S00, drive: 0, couple: 0, read: 0, outcome: -1, n: 0, flash: 0, trail0: null, trail1: null, axis: 0, cap: null, coll: 0 };
  if (si === 4) {
    q.formula = `${K('ψ')} = ${K('00')}`;
  } else if (si === 5) {
    const x = (tau - 1.2) / 3.8, s = smoother(x);
    q.st = stateH(s); q.drive = x > 0 && x < 1 ? Math.max(bell(x), 0.12) : (tau < 1.2 ? 0.12 * smooth(tau / 0.6) : 0);
    q.axis = smooth(tau / 0.8) * (1 - smooth((tau - 5.6) / 1.0));
    q.trail0 = []; const n = Math.round(s * 44);
    for (let i = 0; i <= n; i++) q.trail0.push(reduced(stateH(i / 44)).r0);
    q.formula = s < 0.999 ? `${K('00')} → ( ${K('00')} + ${K('10')} ) / √2` : `${K('ψ')} = ( ${K('00')} + ${K('10')} ) / √2`;
  } else if (si === 6) {
    const x = (tau - 1.2) / 4.2, s = smoother(x);
    q.st = stateCX(s); q.couple = x > 0 && x < 1 ? Math.max(bell(x), 0.12) : (tau < 1.2 ? 0.12 * smooth(tau / 0.6) : 0);
    q.trail0 = []; q.trail1 = []; const n = Math.round(s * 40);
    for (let i = 0; i <= n; i++) { const r = reduced(stateCX(i / 40)); q.trail0.push(r.r0); q.trail1.push(r.r1); }
    q.formula = s < 0.999 ? `${K('ψ')} → ( ${K('00')} + ${K('11')} ) / √2` : `${K('ψ')} = ( ${K('00')} + ${K('11')} ) / √2`;
  } else if (si === 7) {
    q.st = BELL; q.formula = `${K('ψ')} = ( ${K('00')} + ${K('11')} ) / √2`;
    if (tau < M_INTRO) {
      q.cap = '読み出しパルスを送って、2 個を測定する';
    } else if (tau < M_FAST0) {

      else {

        q.flash = clamp(1 - (u - 0.4) / 0.35);
        q.coll = u < 1.0 ? clamp((u - 0.4) / 0.1) : clamp(1 - (u - 1.0) / 0.3);
        const o = q.outcome ? '11' : '00';
        q.cap = u < 1.0 ? `${k + 1} 回目の結果: ${o} (2 個とも ${q.outcome})` : 'リセットして、同じ回路をもう一度実行';

  const r = reduced(q.st);
  q.p = r.p; q.r0 = r.r0; q.r1 = r.r1;
  if (q.outcome >= 0 && q.coll > 0) {   // 測定で 00 (上向き) か 11 (下向き) に決まった状態
    const z = (q.outcome ? -1 : 1) * q.coll; q.r0 = [0, 0, z]; q.r1 = [0, 0, z];
  }
  q.len0 = Math.hypot(...q.r0); q.len1 = Math.hypot(...q.r1);
  q.ent = Math.sqrt(clamp(1 - q.len0 * q.len0));

}

/* ================================================================
   画面の寸法・カメラ
   ================================================================ */
const hdrEl = $('#hdr'), panelEl = $('#panel'), circEl = $('#circuit');
const view = { W: 1, H: 1, rem: 14, hdrB: 0, panelL: 0, cx: 0, cy: 0, rw: 1, rh: 1, bandTop: 0, bandBot: 0 };
let labelsDirty = true, curStage = -1;
function measure() {
  view.W = window.innerWidth; view.H = window.innerHeight;
  view.rem = parseFloat(getComputedStyle(document.documentElement).fontSize) || 14;
  view.hdrB = hdrEl.getBoundingClientRect().bottom; view.panelL = panelEl.getBoundingClientRect().left;
  renderer.setSize(view.W, view.H, false);
  cam.aspect = view.W / view.H;
  labelsDirty = true;
  applyRegion();
}
function applyRegion() {
  const r = view.rem, B = curStage >= 0 && STAGES[curStage].world === 'B';
  let x0, x1, y0, y1;
  if (B) { x0 = 0.5 * r; x1 = view.panelL - 0.5 * r; y0 = view.hdrB + 0.3 * r; y1 = view.H - 13.6 * r; }
  else { x0 = 14.4 * r; x1 = view.panelL - 15.4 * r; y0 = view.hdrB + 0.4 * r; y1 = view.H - 3.7 * r; }
  view.cx = (x0 + x1) / 2; view.cy = (y0 + y1) / 2; view.rw = Math.max(50, x1 - x0); view.rh = Math.max(50, y1 - y0);
  view.bandTop = view.hdrB + 0.7 * r; view.bandBot = view.H - 3.9 * r;
  cam.setViewOffset(view.W, view.H, view.W / 2 - view.cx, view.H / 2 - view.cy, view.W, view.H);
  cam.updateProjectionMatrix();
}
const TANH = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
const fit = (needW, needH) => view.H / Math.min(view.rw / needW, view.rh / needH) / (2 * TANH);
const pose = { pos: V3(), tgt: V3() };
function poseFor(si, t) {
  const v = STAGES[si].view; let az, el, d;
  if (v === 0) { pose.tgt.set(0, 1.55, 0); az = -0.55 + 0.03 * Math.min(t, 20); el = 0.19; d = fit(6.2, 9.0); }
  else if (v === 1) { pose.tgt.set(0, -1.55, 0.04); az = 0.12 * Math.sin((t - 20) * 0.9); el = 0.06; d = fit(1.3, 1.2); }
  else { pose.tgt.set(0, -0.12, 0); az = 0.42 + 0.09 * Math.sin(t * 0.5); el = 0.27; d = fit(7.1, 4.35); }
  pose.pos.set(pose.tgt.x + d * Math.sin(az) * Math.cos(el), pose.tgt.y + d * Math.sin(el), pose.tgt.z + d * Math.cos(az) * Math.cos(el));
  return pose;
}
const camS = { fp: V3(), ft: V3(), t0: 0, dur: 0, user: false, drag: false, last: 0 };
controls.addEventListener('start', () => { camS.user = true; camS.drag = true; camS.last = performance.now(); });
controls.addEventListener('end', () => { camS.drag = false; camS.last = performance.now(); });
function takeCamera(dur) { camS.user = false; camS.fp.copy(cam.position); camS.ft.copy(controls.target); camS.t0 = performance.now(); camS.dur = dur; }
function updateCamera(si, now) {
  if (camS.user && playing && !camS.drag && now - camS.last > 9000) takeCamera(2.0);   // しばらく触らなければ自動のカメラへ戻る
  if (!camS.user) {
    const p = poseFor(si, tNow), k = camS.dur > 0 ? smoother((now - camS.t0) / 1000 / camS.dur) : 1;
    cam.position.lerpVectors(camS.fp, p.pos, k); controls.target.lerpVectors(camS.ft, p.tgt, k);
  }
  controls.update();
}

/* ================================================================
   段階の切り替えと毎フレームの更新
   ================================================================ */
let tNow = 0, playing = true, lastMs = performance.now();
const playBtn = $('#playBtn');
function setPlaying(p) { playing = p; playBtn.classList.toggle('paused', !p); playBtn.querySelector('span').textContent = p ? '一時停止' : '再生'; }
playBtn.addEventListener('click', () => { setPlaying(!playing); playBtn.blur(); });
function seek(t) { tNow = ((t % TOTAL) + TOTAL) % TOTAL; }
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight') seek(STAGES[(stageAt(tNow) + 1) % STAGES.length].t0 + 0.001);
  else if (e.code === 'ArrowLeft') seek(STAGES[(stageAt(tNow) + STAGES.length - 1) % STAGES.length].t0 + 0.001);
});
window.addEventListener('resize', measure);

function enterStage(si) {
  const prev = curStage; curStage = si; const s = STAGES[si];
  document.body.classList.toggle('phaseA', s.world === 'A'); document.body.classList.toggle('phaseB', s.world === 'B');
  STAGES.forEach((x, i) => { x.btn.classList.toggle('on', i === si); x.btn.classList.toggle('done', i < si); x.body.classList.toggle('show', i === si); });
  setText($('#pNo'), String(si + 1)); setHTML($('#pTitle'), s.title);
  fridge.visible = s.world === 'A'; qworld.visible = s.world === 'B';
  LABELS.forEach(l => { l.on = l.st.includes(si); l.el.classList.toggle('vis', l.on); if (!l.on) { l.line.style.display = l.dot.style.display = 'none'; } });
  applyRegion();
  const worldCh = prev < 0 || STAGES[prev].world !== s.world, viewCh = prev < 0 || STAGES[prev].view !== s.view;
  if (worldCh) takeCamera(0); else if (viewCh) takeCamera(2.3);
}

const anim = { shield: 0.3, sig: 0.1, he: 0 };
const pv = V3(), camRight = V3();
function updateFridge(si, tau, dt, time) {
  const k = 1 - Math.exp(-dt * 6);
  // 外側の缶: 最初の段階で下へ抜き取る
  let oc = 0, oy = 0;
  if (si === 0) { const u = smooth((tau - 1.0) / 2.2); oc = 0.3 * (1 - u); oy = -4.2 * u; }
  outerCan.visible = oc > 0.004; outerMat.opacity = oc; outerCan.position.y = PL[0].bot - 3.85 + oy;
  // 磁気シールド: チップを見る段階では透かす
  anim.shield = lerp(anim.shield, si === 3 ? 0.05 : 0.3, k); shieldMat.opacity = anim.shield;
  // 温度の輪
  PL.forEach((p, i) => {
    let o = 0.45, sc = 1;
    if (si === 1) { const u = tau - (0.5 + i * 0.8); o = u < 0 ? 0.15 : 0.6 + 0.4 * Math.exp(-u * 1.5); sc = u < 0 ? 1 : 1 + 0.035 * Math.exp(-u * 2.5); }
    p.ring.material.opacity = o; p.ring.scale.setScalar(sc);
  });
  // ヘリウムの流れ (段階 2)
  anim.he = lerp(anim.he, si === 1 && tau > 0.8 ? 1 : 0, k);
  heDots.forEach(d => {
    d.s.visible = anim.he > 0.02;
    if (!d.s.visible) return;
    const u = (d.ph + time * 0.16) % 1; (d.up ? heUp : heDown).getPointAt(u, d.s.position);
    d.s.material.opacity = anim.he * Math.sin(Math.PI * u) * 0.95;
  });
  // 信号のパルス (段階 3)
  anim.sig = lerp(anim.sig, si === 2 ? 0.75 : 0.1, k);
  for (const key in SIG) {
    const s = SIG[key]; s.mat.emissiveIntensity = anim.sig;
    s.pulses.forEach((sp, i) => {
      let u = -1;
      if (si === 2) {
        if (key === 'c0') u = (tau - (0.2 + 1.5 * i)) / 2.3;
        else if (key === 'c1') u = (tau - (0.9 + 1.5 * i)) / 2.3;
        else if (key === 'ri') u = i < 2 ? (tau - (0.5 + 2.2 * i)) / 2.2 : -1;
        else u = i < 2 ? 1 - (tau - (2.7 + 2.2 * i)) / 2.0 : -1;
      }
      sp.visible = u > 0 && u < 1;
      if (!sp.visible) return;
      s.curve.getPointAt(u, sp.position);
      const y = sp.position.y; let size;
      if (s.kind === 'in') {   // 減衰器を通るたびに弱くなる
        size = 0.36; [2, 4, 5].forEach(j => { size *= lerp(1, 0.72, smooth((PL[j].top + 0.3 - y) / 0.2)); });
      } else {                 // HEMT 増幅器で大きくなる
        size = lerp(0.13, 0.36, smooth((y - (PL[2].top + 0.1)) / 0.25));
      }
      sp.scale.setScalar(size); sp.material.opacity = Math.min(1, Math.min(u, 1 - u) * 12);
    });
  }
  // チップ上 (段階 4)
  const onChip = si === 3 && tau > 2.2;
  chipMats.qubit.emissiveIntensity = lerp(chipMats.qubit.emissiveIntensity, onChip ? 0.35 + 0.3 * Math.sin(time * 5) : 0, k);
  chipPulses.forEach((sp, i) => {
    sp.visible = onChip; if (!onChip) return;
    const u = (time * 0.8 + i * 0.37) % 1;
    if (i < 2) { const q = i === 0 ? CH.q0 : CH.q1; sp.position.copy(cw(q[0], lerp(-0.275, q[1] - 0.1, u))); }
    else sp.position.copy(cw(lerp(-0.27, 0.27, u), 0.215));
    sp.material.opacity = Math.sin(Math.PI * u);
  });
}

function updateQuantum(q, time) {
  BS[0].set(q.r0); BS[1].set(q.r1);
  BS[0].setTrail(q.trail0 || []); BS[1].setTrail(q.trail1 || []);
  hAxis.visible = q.axis > 0.02;
  hAxis.children[0].material.opacity = q.axis; hAxis.children[0].material.transparent = true; hAxis.children[1].material.opacity = q.axis;
  BS.forEach((b, i) => {
    b.flash.material.opacity = q.flash * 0.3; b.flash.visible = q.flash > 0.01;
    b.badge[0].visible = q.outcome === 0 && q.coll > 0.5; b.badge[1].visible = q.outcome === 1 && q.coll > 0.5;
  });
  // もつれの帯
  const e = q.ent; link.visible = e > 0.03; linkLabel.visible = e > 0.6; linkLabel.material.opacity = clamp((e - 0.6) / 0.3);
  if (link.visible) {
    for (let i = 0; i < LINK_N; i++) {
      const u = i / (LINK_N - 1), x = lerp(-QX, QX, u), strand = i % 2 ? 1 : -1;
      const env = Math.sin(Math.PI * u), a = u * 9 + time * 2.2 * strand + (strand > 0 ? 0 : Math.PI);
      tmpM.makeScale(e, e, e); tmpM.setPosition(x, Math.cos(a) * 0.13 * env * strand, Math.sin(a) * 0.13 * env);
      link.setMatrixAt(i, tmpM);
    }
    link.instanceMatrix.needsUpdate = true;
  }
  // 台座のチップの上を走るマイクロ波
  const yb = PED_Y + 0.07;
  const setBeads = (im, n, fn, amp) => {
    im.visible = amp > 0.01; if (!im.visible) return;
    for (let i = 0; i < n; i++) { const p = fn(i / (n - 1)); tmpM.makeTranslation(p[0], yb + p[1], p[2]); im.setMatrixAt(i, tmpM); }
    im.instanceMatrix.needsUpdate = true;
  };
  setBeads(beads.drive, 22, u => { const z = lerp(1.12, 0.43, u); return [-QX, 0.11 * q.drive * Math.sin(z * 22 + time * 11) + 0.02, z]; }, q.drive);
  setBeads(beads.couple, 30, u => { const x = lerp(-1.4, 1.4, u); return [x, 0.11 * q.couple * Math.sin(x * 9) * Math.cos(time * 9) + 0.02, 0]; }, q.couple);
  setBeads(beads.read, 48, u => { const x = lerp(-2.95, 2.95, u); return [x, 0.1 * q.read * Math.sin(x * 9 - time * 12) + 0.02, -0.95]; }, q.read);
  pedMats[0].emissiveIntensity = 0.9 * Math.max(q.drive, q.couple, q.read * 0.8);
  pedMats[1].emissiveIntensity = 0.9 * Math.max(q.couple, q.read * 0.8);
}

const el = { cap: $('#capText'), fade: $('#fade'), formula: $('#formula'), shotN: $('#shotN'), len0: $('#len0'), len1: $('#len1'), ph: $('#ph'),
  gH: $('#gH'), gCl: $('#gCl'), gCd: $('#gCd'), gCt: $('#gCt'), gM0: $('#gM0'), gM1: $('#gM1'), res0: $('#res0'), res1: $('#res1'),
  clH: $('#clH'), clC: $('#clC'), clM: $('#clM'), clR: $('#clR') };
const KEYS = ['00', '01', '10', '11'];
function updateUI(si, tau, q) {
  const s = STAGES[si];
  STAGES.forEach((x, i) => setW(x.bar, i < si ? 1 : i === si ? tau / x.dur : 0));
  // 字幕
  let cap = '';
  if (q && q.cap) cap = q.cap; else for (const c of s.caps) if (tau >= c[0]) cap = c[1];
  setHTML(el.cap, cap);
  // 世界が切り替わる前後は暗転
  let f = 0;
  for (const tb of [0, STAGES[4].t0, TOTAL]) f = Math.max(f, 1 - Math.abs(tNow - tb) / 0.45);
  const fs = clamp(f).toFixed(2); if (el.fade.__o !== fs) { el.fade.__o = fs; el.fade.style.opacity = fs; }
  if (!q) return;
  // 状態の表
  setHTML(el.formula, q.formula);
  const n = q.n, c11 = pre11[n], c = [n - c11, 0, 0, c11];
  KEYS.forEach((k, i) => {
    const r = rows[k];
    setW(r.pb, q.p[i]); setText(r.pt, Math.round(q.p[i] * 100) + '%');
    setW(r.cb, n ? c[i] / n : 0); setText(r.ct, String(c[i]));
  });
  setText(el.shotN, String(n));
  setText(el.len0, q.len0.toFixed(2)); setText(el.len1, q.len1.toFixed(2));
  // 回路図
  let x;
  if (si === 4) x = lerp(8, 12, tau / s.dur);
  else if (si === 5) x = lerp(12, 18.5, tau / s.dur);
  else if (si === 6) x = lerp(18.5, 25.5, tau / s.dur);
  else x = lerp(25.5, 29, smooth(tau / 1.0));
  const xs = x.toFixed(2) + 'rem'; if (el.ph.__x !== xs) { el.ph.__x = xs; el.ph.style.left = xs; }
  const aH = si === 5, aC = si === 6, aM = si === 7;
  setCls(el.gH, 'act', aH); setCls(el.clH, 'act', aH);
  setCls(el.gCl, 'act', aC); setCls(el.gCd, 'act', aC); setCls(el.gCt, 'act', aC); setCls(el.clC, 'act', aC);
  setCls(el.gM0, 'act', aM); setCls(el.gM1, 'act', aM); setCls(el.clM, 'act', aM); setCls(el.clR, 'act', aM);
  const has = q.outcome >= 0 && q.coll > 0.5, d = has ? String(q.outcome) : '';
  setText(el.res0, d); setText(el.res1, d); setCls(el.res0, 'has', has); setCls(el.res1, 'has', has);
}

function layoutCol(list, top, bot, gap) {
  list.sort((a, b) => a.sy - b.sy);
  let y = top;
  for (const l of list) { l.ny = Math.max(l.sy - l.h / 2, y); y = l.ny + l.h + gap; }
  let lim = bot;
  for (let i = list.length - 1; i >= 0; i--) { const l = list[i]; if (l.ny + l.h > lim) l.ny = lim - l.h; lim = l.ny - gap; }
}
function updateLabels(si, tau) {
  if (STAGES[si].world !== 'A') return;
  if (labelsDirty) { LABELS.forEach(l => { l.h = l.el.offsetHeight; l.w = l.el.offsetWidth; l.x0 = l.el.offsetLeft; }); labelsDirty = false; }
  camRight.setFromMatrixColumn(cam.matrixWorld, 0); camRight.y = 0; camRight.normalize();
  const cols = { L: [], R: [] };
  for (const l of LABELS) {
    if (!l.on) continue;
    if (l.plate !== undefined) { const p = PL[l.plate]; pv.set(-camRight.x * p.r, p.y, -camRight.z * p.r); } else pv.copy(l.anchor);
    pv.project(cam);
    l.sx = (pv.x * 0.5 + 0.5) * view.W; l.sy = (-pv.y * 0.5 + 0.5) * view.H;
    l.off = pv.z > 1 || l.sx < 0 || l.sx > view.panelL || l.sy < view.hdrB || l.sy > view.H;
    cols[l.col].push(l);
    if (l.plate !== undefined) {
      const reached = si !== 1 || tau >= 0.5 + l.plate * 0.8;
      setCls(l.el, 'dim', !reached); setCls(l.el, 'hot', si === 1 && reached && tau < 0.5 + l.plate * 0.8 + 0.8);
    }
  }
  const gap = 0.45 * view.rem;
  layoutCol(cols.L, view.bandTop, view.bandBot, gap); layoutCol(cols.R, view.bandTop, view.bandBot, gap);
  for (const l of LABELS) {
    if (!l.on) continue;
    if (Math.abs(l.ny - l.ty) > 0.25) { l.ty = l.ny; l.el.style.transform = `translateY(${l.ny.toFixed(1)}px)`; }
    const show = l.off ? 'none' : '';
    if (l.line.style.display !== show) l.line.style.display = l.dot.style.display = show;
    if (l.off) continue;
    const lx = l.col === 'L' ? l.x0 + l.w : l.x0, ly = l.ny + l.h / 2;
    l.line.setAttribute('x1', lx.toFixed(1)); l.line.setAttribute('y1', ly.toFixed(1));
    l.line.setAttribute('x2', l.sx.toFixed(1)); l.line.setAttribute('y2', l.sy.toFixed(1));
    l.dot.setAttribute('cx', l.sx.toFixed(1)); l.dot.setAttribute('cy', l.sy.toFixed(1));
  }
}

function frame(ms) {
  requestAnimationFrame(frame);
  const dtReal = Math.max(0, (ms - lastMs) / 1000); lastMs = ms;
  if (playing) { tNow += dtReal; if (tNow >= TOTAL) { tNow %= TOTAL; newShots(); } }
  const si = stageAt(tNow), tau = tNow - STAGES[si].t0, dt = Math.min(dtReal, 0.1), time = ms / 1000;
  if (si !== curStage) enterStage(si);
  let q = null;
  if (STAGES[si].world === 'A') updateFridge(si, tau, dt, time);
  else { q = quantumAt(si, tau); updateQuantum(q, time); }
  updateCamera(si, ms);
  renderer.render(scene, cam);
  updateUI(si, tau, q);
  updateLabels(si, tau);
}

measure();
enterStage(0);
measure();
window.__appReady = true;
window.__demo = { seek, setPlaying, get t() { return tNow; }, TOTAL, STAGES, quantumAt, reduced, stateH, stateCX, cam, view, LABELS };
requestAnimationFrame(t => { lastMs = t; frame(t); });
</script>
