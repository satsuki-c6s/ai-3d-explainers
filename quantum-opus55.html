<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>超伝導量子コンピューターのしくみ（3D アニメーション）</title>
<link rel="icon" href="data:,">
<style>
:root{
  --q0:#ffab40; --q1:#3fd2ff; --bg:#060a13; --panel:rgba(13,19,33,.94);
  --line:rgba(140,170,220,.22); --txt:#e9eef7; --sub:#a3b3ca; --gold:#f0c35a; --blue:#4d9bff; --orange:#ff9a3c;
}
html{font-size:max(9px, min(1.09375vw, 1.9444vh));}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP","Source Han Sans JP",system-ui,sans-serif;}
.math{font-family:"Cambria Math","Segoe UI Symbol","STIX Two Math","Noto Sans Math","DejaVu Sans",inherit;}
#app{position:fixed;inset:0;display:grid;grid-template-rows:3.7rem minmax(0,1fr) 3.3rem;grid-template-columns:minmax(0,1fr) 31rem;}
header{grid-column:1/3;grid-row:1;display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:0 1.1rem;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0d1424,#0a101d);}
.ttl h1{font-size:1.28rem;font-weight:700;letter-spacing:.03em;white-space:nowrap;}
.ttl h1 span{color:var(--gold)}
.ttl p{font-size:.78rem;color:var(--sub);margin-top:.15rem;white-space:nowrap;}
.now{display:flex;align-items:center;gap:.8rem;white-space:nowrap;}
.now .lbl{font-size:.78rem;color:var(--sub);}
#nowNum{font-size:1rem;font-weight:700;color:#0b1020;background:var(--gold);border-radius:.4rem;padding:.12rem .5rem;}
#nowName{font-size:1.15rem;font-weight:700;min-width:13rem;}
#clock{font-size:.82rem;color:var(--sub);font-variant-numeric:tabular-nums;min-width:6.6rem;text-align:right;}
button{font:inherit;color:inherit;cursor:pointer}
#pauseBtn{font-size:.82rem;border:1px solid var(--line);background:#16213a;border-radius:.4rem;padding:.3rem .7rem;min-width:6.2rem;}
#pauseBtn:hover{background:#1e2d4d}
#view{grid-column:1;grid-row:2;position:relative;overflow:hidden;
  background:radial-gradient(ellipse at 50% 35%,#18233d 0%,#0b1120 55%,#05080f 100%);}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;}
#leaders{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
#labels{position:absolute;inset:0;pointer-events:none;}
.lab{position:absolute;left:0;top:0;width:13.4rem;padding:.42rem .6rem .48rem .7rem;border-radius:.45rem;
  background:rgba(9,14,26,.86);border:1px solid rgba(160,190,240,.28);border-left:.25rem solid var(--c,#f0c35a);
  opacity:0;visibility:hidden;transition:opacity .35s;}
.lab.show{opacity:1;visibility:visible;}
.lab b{display:block;font-size:.9rem;line-height:1.3;color:var(--c,#f0c35a);}
.lab span{display:block;font-size:.76rem;line-height:1.45;color:#d5deeb;margin-top:.12rem;}
#hint{position:absolute;left:50%;top:.55rem;transform:translateX(-50%);font-size:.74rem;color:var(--sub);
  background:rgba(8,12,22,.7);border:1px solid var(--line);border-radius:1rem;padding:.22rem .8rem;white-space:nowrap;pointer-events:none;}
#panel{grid-column:2;grid-row:2;display:flex;flex-direction:column;gap:.45rem;padding:.65rem .75rem;overflow:hidden;
  background:var(--panel);border-left:1px solid var(--line);}
.card{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:.55rem;padding:.6rem .8rem .7rem;flex:0 0 auto;}
.card h2{font-size:1.08rem;line-height:1.35;color:var(--gold);margin-bottom:.35rem;}
.card p{font-size:.86rem;line-height:1.62;}
.sec{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:.55rem;padding:.5rem .7rem;}
.sec h3{font-size:.84rem;color:var(--gold);margin-bottom:.35rem;font-weight:700;}
#devInfo{display:flex;flex-direction:column;gap:.55rem;min-height:0;}
#qInfo{display:none;flex-direction:column;gap:.4rem;flex:1 1 auto;min-height:0;}
.facts{list-style:none;font-size:.8rem;line-height:1.5;}
.facts li{display:flex;gap:.6rem;padding:.28rem 0;border-bottom:1px dashed rgba(160,190,240,.15);}
.facts li:last-child{border-bottom:none}
.facts li em{font-style:normal;color:var(--sub);flex:0 0 8.6rem;}
.ladder{list-style:none;display:flex;flex-direction:column;gap:.28rem;}
.ladder li{display:grid;grid-template-columns:6.4rem 1fr;align-items:center;gap:.6rem;padding:.3rem .5rem;border-radius:.4rem;
  background:rgba(255,255,255,.03);border:1px solid transparent;transition:background .3s,border-color .3s,opacity .3s;opacity:.45;}
.ladder li.on{opacity:1;}
.ladder li.cur{background:rgba(240,195,90,.13);border-color:rgba(240,195,90,.5);}
.ladder .t{font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums;}
.ladder .d{font-size:.76rem;line-height:1.4;}
.ladder .d b{display:block;font-size:.82rem;}
.flow{list-style:none;counter-reset:f;display:flex;flex-direction:column;gap:.2rem;}
.flow li{position:relative;font-size:.78rem;line-height:1.45;padding:.3rem .5rem .3rem 2rem;border-radius:.4rem;background:rgba(255,255,255,.03);}
.flow li::before{counter-increment:f;content:counter(f);position:absolute;left:.5rem;top:.32rem;width:1.1rem;height:1.1rem;border-radius:50%;
  background:var(--fc,#4d9bff);color:#081020;font-weight:700;font-size:.7rem;display:flex;align-items:center;justify-content:center;}
.flow li b{color:var(--fc,#4d9bff)}
.small{font-size:.76rem;line-height:1.55;color:#d5deeb;}
.levels{width:100%;height:auto;display:block;}
/* quantum */
.circ svg{width:100%;height:auto;display:block;}
.circ{padding:.3rem .5rem;}
.circ .g{transition:filter .3s}
.circ .g.on{filter:drop-shadow(0 0 4px #ffd36b);}
.circ .g.on .box{stroke:#ffd36b;fill:rgba(255,211,107,.22)}
#blochSec{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
#blochLegend{font-size:.7rem;line-height:1.45;color:var(--sub);margin-bottom:.15rem;}
#blochWrap{position:relative;flex:1 1 auto;min-height:5rem;}
#cBloch{position:absolute;inset:0;width:100%;height:100%;display:block;}
#entBadge{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:.74rem;font-weight:700;color:#ffe08a;
  background:rgba(60,40,0,.55);border:1px solid rgba(255,220,120,.6);border-radius:1rem;padding:.15rem .55rem;opacity:0;transition:opacity .4s;white-space:nowrap;}
#entBadge.show{opacity:1}
.caps{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;flex:0 0 auto;}
.cap{font-size:.74rem;line-height:1.4;text-align:center;min-height:2.1rem;}
.cap b{font-size:.82rem;margin-right:.35rem}
#cap0 b{color:var(--q0)} #cap1 b{color:var(--q1)}
#stateLine{font-size:.84rem;line-height:1.4;text-align:center;min-height:2.45rem;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.04);border-radius:.45rem;padding:0 .5rem;flex:0 0 auto;}
.bars{flex:0 0 auto;}
.barsHead{display:flex;justify-content:space-between;font-size:.76rem;color:var(--sub);margin-bottom:.25rem;}
.barsHead b{color:var(--txt)}
.brow{display:grid;grid-template-columns:2.2rem 1fr 4.6rem;align-items:center;gap:.5rem;height:1.12rem;}
.brow .k{font-size:.8rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
.brow .track{position:relative;height:.75rem;background:rgba(255,255,255,.07);border-radius:.3rem;overflow:hidden;}
.brow .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#c9932f,#ffd36b);border-radius:.3rem;}
.brow .exp{position:absolute;top:-1px;bottom:-1px;left:50%;border-left:2px dashed rgba(255,255,255,.55);display:none;}
.brow .v{font-size:.78rem;text-align:right;font-variant-numeric:tabular-nums;}
.note{font-size:.68rem;color:var(--sub);margin-top:.2rem;line-height:1.4;}
footer{grid-column:1/3;grid-row:3;display:flex;gap:.35rem;padding:.4rem .75rem;border-top:1px solid var(--line);background:#0a101d;}
.step{flex:1 1 0;min-width:0;position:relative;border:1px solid var(--line);border-radius:.45rem;background:#0f1729;
  display:flex;align-items:center;gap:.4rem;padding:0 .5rem;font-size:.8rem;color:var(--sub);overflow:hidden;white-space:nowrap;}
.step i{font-style:normal;flex:0 0 auto;width:1.3rem;height:1.3rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#1d2a45;color:var(--txt);font-size:.72rem;font-weight:700;}
.step .bar{position:absolute;left:0;bottom:0;height:.2rem;width:0;background:var(--gold);}
.step.done{color:#cfd9e8}
.step.done i{background:#6b5a2c}
.step.cur{color:var(--txt);border-color:rgba(240,195,90,.7);background:#1a2238;}
.step.cur i{background:var(--gold);color:#0b1020}
.step:hover{border-color:rgba(240,195,90,.5)}
#err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;font-size:1.2rem;background:#060a13;z-index:9;padding:2rem;text-align:center;}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header>
    <div class="ttl">
      <h1><span>超伝導</span>量子コンピューターのしくみ</h1>
      <p>希釈冷凍機の中で、2 つの量子ビットが計算するまで</p>
    </div>
    <div class="now">
      <span class="lbl">いまの段階</span>
      <span id="nowNum">1 / 8</span>
      <span id="nowName">装置の全体</span>
      <span id="clock">0 秒 / 59 秒</span>
      <button id="pauseBtn" type="button">一時停止</button>
    </div>
  </header>

  <div id="view">
    <canvas id="c3d"></canvas>
    <svg id="leaders"></svg>
    <div id="labels"></div>
    <div id="hint">ドラッグで回転・ホイールで拡大・右ドラッグで移動</div>
  </div>

  <aside id="panel">
    <section class="card">
      <h2 id="cardTitle"></h2>
      <p id="cardText"></p>
    </section>

    <div id="devInfo"></div>

    <div id="qInfo">
      <section class="sec circ">
        <svg viewBox="0 0 420 80" aria-label="量子回路">
          <g fill="none" stroke="#8fa3c2" stroke-width="2">
            <line x1="78" y1="22" x2="262" y2="22"/>
            <line x1="78" y1="54" x2="262" y2="54"/>
            <line x1="296" y1="20" x2="336" y2="20"/><line x1="296" y1="24" x2="336" y2="24"/>
            <line x1="296" y1="52" x2="336" y2="52"/><line x1="296" y1="56" x2="336" y2="56"/>
          </g>
          <text x="6" y="27" fill="#ffab40" font-size="15" font-weight="700">q0</text>
          <text x="32" y="27" fill="#dfe7f3" font-size="15" class="math">|0⟩</text>
          <text x="6" y="59" fill="#3fd2ff" font-size="15" font-weight="700">q1</text>
          <text x="32" y="59" fill="#dfe7f3" font-size="15" class="math">|0⟩</text>
          <g id="gH" class="g">
            <rect class="box" x="118" y="8" width="30" height="28" rx="4" fill="#1b2742" stroke="#c9d6ea" stroke-width="2"/>
            <text x="133" y="28" fill="#fff" font-size="17" font-weight="700" text-anchor="middle">H</text>
          </g>
          <g id="gCX" class="g">
            <line x1="205" y1="22" x2="205" y2="64" stroke="#c9d6ea" stroke-width="2"/>
            <circle cx="205" cy="22" r="5.5" fill="#c9d6ea"/>
            <circle class="box" cx="205" cy="54" r="10" fill="#1b2742" stroke="#c9d6ea" stroke-width="2"/>
            <line x1="195" y1="54" x2="215" y2="54" stroke="#c9d6ea" stroke-width="2"/>
            <line x1="205" y1="44" x2="205" y2="64" stroke="#c9d6ea" stroke-width="2"/>
          </g>
          <g id="gM" class="g">
            <rect class="box" x="264" y="8" width="32" height="28" rx="4" fill="#1b2742" stroke="#c9d6ea" stroke-width="2"/>
            <path d="M270 31 A10 10 0 0 1 290 31" fill="none" stroke="#c9d6ea" stroke-width="2"/>
            <line x1="280" y1="31" x2="287" y2="17" stroke="#c9d6ea" stroke-width="2"/>
            <rect class="box" x="264" y="40" width="32" height="28" rx="4" fill="#1b2742" stroke="#c9d6ea" stroke-width="2"/>
            <path d="M270 63 A10 10 0 0 1 290 63" fill="none" stroke="#c9d6ea" stroke-width="2"/>
            <line x1="280" y1="63" x2="287" y2="49" stroke="#c9d6ea" stroke-width="2"/>
          </g>
          <text x="342" y="27" fill="#dfe7f3" font-size="14" id="out0">0 / 1</text>
          <text x="342" y="59" fill="#dfe7f3" font-size="14" id="out1">0 / 1</text>
          <text x="133" y="78" fill="#a3b3ca" font-size="12" text-anchor="middle">重ね合わせ</text>
          <text x="205" y="78" fill="#a3b3ca" font-size="12" text-anchor="middle">もつれ</text>
          <text x="280" y="78" fill="#a3b3ca" font-size="12" text-anchor="middle">測定</text>
          <line id="playhead" x1="95" y1="2" x2="95" y2="68" stroke="#ffd36b" stroke-width="2" stroke-dasharray="4 3"/>
        </svg>
      </section>

      <section class="sec" id="blochSec">
        <div id="blochLegend">ブロッホ球：北極 = <span class="math">|0⟩</span>、南極 = <span class="math">|1⟩</span>、赤道 = 半分ずつの重ね合わせ。矢印の長さ = その量子ビット 1 つだけで状態が決まる度合い（0〜1）</div>
        <div id="blochWrap"><canvas id="cBloch"></canvas><div id="entBadge">⟷ 量子もつれ</div></div>
        <div class="caps"><div class="cap" id="cap0"></div><div class="cap" id="cap1"></div></div>
      </section>

      <div id="stateLine"></div>

      <section class="sec bars">
        <div class="barsHead"><span id="barsMode">確率</span><span id="barsCount"></span></div>
        <div class="brow"><span class="k">00</span><div class="track"><div class="fill" id="bf0"></div><div class="exp" id="be0"></div></div><span class="v" id="bv0"></span></div>
        <div class="brow"><span class="k">01</span><div class="track"><div class="fill" id="bf1"></div><div class="exp" id="be1"></div></div><span class="v" id="bv1"></span></div>
        <div class="brow"><span class="k">10</span><div class="track"><div class="fill" id="bf2"></div><div class="exp" id="be2"></div></div><span class="v" id="bv2"></span></div>
        <div class="brow"><span class="k">11</span><div class="track"><div class="fill" id="bf3"></div><div class="exp" id="be3"></div></div><span class="v" id="bv3"></span></div>
        <div class="note" id="barsNote">左の数字が q0、右が q1。理想的な計算（実機ではノイズで 01・10 も少し出る）</div>
      </section>
    </div>
  </aside>

  <footer id="steps"></footer>
</div>
<div id="err">このページの表示には WebGL が使えるブラウザー（Chrome など）が必要です。</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = (id) => document.getElementById(id);
const textCache = new Map();
function setHTML(el, html) { if (textCache.get(el) !== html) { textCache.set(el, html); el.innerHTML = html; } }
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
const ease = (x) => { x = clamp(x, 0, 1); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const K = (s) => `<span class="math">${s}</span>`;

/* ============================================================
   段階（フェーズ）の定義 — 合計 59 秒
   ============================================================ */
const PH = [
  { key: 'overview', short: '装置の全体', name: '装置の全体', dur: 7,
    title: '希釈冷凍機 ― 金色のシャンデリア',
    text: '金色の段の集まりが「希釈冷凍機」です。上から円板（プレート）がつり下がり、下の段ほど冷たくなります。いちばん下の磁気シールドの中に量子ビットのチップがあり、約 0.01 K まで冷やされます。ふだんは外側を真空の缶でおおいます（ここでは外して表示）。' },
  { key: 'temps', short: '温度の段', name: '段ごとの温度', dur: 8,
    title: '下の段ほど冷たい ― 300 K から 0.01 K へ',
    text: '円板は熱をよく伝える銅に金めっきしたもの。上の 2 段はパルス管冷凍機（ヘリウムガスの圧縮と膨張）で約 50 K・約 4 K に冷やします。その下は、ヘリウム3 がヘリウム4 の液に溶け込むときに熱をうばう性質を使い、混合室で約 0.01 K にします。' },
  { key: 'chip', short: 'チップ', name: '量子ビットのチップ', dur: 7,
    title: '量子ビットのチップ ― 超伝導の電気回路',
    text: 'チップは数 mm 角。アルミの回路は約 1.2 K 以下で超伝導（電気抵抗ゼロ）になります。十字形の電極とジョセフソン接合でできた「トランズモン」が 1 個の量子ビット。いちばん低いエネルギーの状態を ' + K('|0⟩') + '、1 つ上を ' + K('|1⟩') + ' として使います。' },
  { key: 'signal', short: '信号の通り道', name: '信号の通り道', dur: 7,
    title: '信号の通り道 ― マイクロ波で操作・読み出し',
    text: '量子ビットは室温の装置から送るマイクロ波のパルス（青い光）で操作します。入力線の減衰器は、上の段から来る熱の雑音を弱めます。チップから返る弱い読み出し信号（オレンジの光）は、サーキュレーターを通り増幅器で大きくされ、室温で読み取られます。' },
  { key: 'hgate', short: 'H ゲート', name: 'H ゲート（重ね合わせ）', dur: 7,
    title: 'H ゲート ― 重ね合わせをつくる',
    text: 'はじめは 2 つとも ' + K('|0⟩') + '（北極）。q0 に H ゲートのパルスを当てると、矢印は x と z の間の軸のまわりに半回転して赤道へ。' + K('|0⟩') + ' と ' + K('|1⟩') + ' が半分ずつの「重ね合わせ」です。q1 は ' + K('|0⟩') + ' のまま。' },
  { key: 'cnot', short: 'CNOT', name: 'CNOT（量子もつれ）', dur: 7,
    title: 'CNOT ゲート ― 量子もつれをつくる',
    text: 'q0 が 1 のときだけ q1 を反転させるゲート。q0 が重ね合わせなので、全体は ' + K('(|00⟩+|11⟩)/√2') + ' の「量子もつれ」に。1 つずつ見ると向きが決まらず、矢印は中心に縮みます（長さ 0）。' },
  { key: 'measure', short: '測定', name: '測定をくり返す', dur: 12,
    title: '測定 ― 何回もくり返して数える',
    text: '測定すると 0 か 1 に決まります（矢印は北極か南極へ）。1 回ごとの結果はランダムですが、q0 と q1 はいつも同じ値。毎回 ' + K('|00⟩') + ' から回路をやり直し、1024 回くり返して数えます。' },
  { key: 'summary', short: 'まとめ', name: 'まとめ', dur: 4,
    title: 'まとめ',
    text: '冷やす → マイクロ波で操作する → 増幅して読み出す。H で重ね合わせ、CNOT でもつれ。測定では 00 と 11 がほぼ半分ずつ出て、01 と 10 は出ません。結果がいつもそろうのが、もつれた状態の特徴です。' },
];
const starts = []; let TOTAL = 0;
PH.forEach((p) => { starts.push(TOTAL); TOTAL += p.dur; });

/* 右パネル（装置の段階）の補足 */
const DEV_INFO = [
  `<section class="sec"><h3>主な数字</h3><ul class="facts">
    <li><em>いちばん冷たい所</em><span>約 0.01 K（−273.14 ℃）</span></li>
    <li><em>宇宙の背景の温度</em><span>約 2.7 K（混合室はその 200 分の 1 以下）</span></li>
    <li><em>冷やす時間</em><span>室温から 1〜2 日ほど</span></li>
    <li><em>冷やし方</em><span>上の段：パルス管冷凍機<br>下の段：ヘリウム3 と ヘリウム4 の混合液</span></li>
    <li><em>外側</em><span>真空の缶と熱をさえぎるシールドで何重にもおおう</span></li>
  </ul></section>`,

    const items = cols[side].sort((a, b) => a.sy - b.sy);
    let y = top;
    for (const it of items) { it.ty = Math.max(it.sy - it.h / 2, y); y = it.ty + it.h + gap; }
    let lim = bottom;
    for (let k = items.length - 1; k >= 0; k--) { const it = items[k]; if (it.ty + it.h > lim) it.ty = lim - it.h; lim = it.ty - gap; }
    for (const it of items) {
      it.y = it.y === null ? it.ty : it.y + (it.ty - it.y) * Math.min(1, dt * 8);
      const x = side === 'L' ? mx : w - mx - colW;
      it.el.style.transform = `translate(${x.toFixed(1)}px, ${it.y.toFixed(1)}px)`;
      const ex = side === 'L' ? x + colW : x, ey = it.y + Math.min(it.h / 2, 1.1 * rem);
      const bx = side === 'L' ? ex + 12 : ex - 12;
      it.path.setAttribute('d', `M${ex.toFixed(1)} ${ey.toFixed(1)} L${bx.toFixed(1)} ${ey.toFixed(1)} L${it.sx.toFixed(1)} ${it.sy.toFixed(1)}`);
      it.path.setAttribute('opacity', '0.85'); it.dot.setAttribute('opacity', '1');
      it.dot.setAttribute('cx', it.sx.toFixed(1)); it.dot.setAttribute('cy', it.sy.toFixed(1));
    }
  }
}

/* ============================================================
   カメラの動き（段階ごと）
   ============================================================ */
const QCAM = { t: [0, CHIP_Y + 0.12, 0.1], p: [0.75, CHIP_Y + 0.6, 1.85], sway: 0.18 };
const CAM = [
  { t: [0.7, 3.35, 0], p: [6.2, 6.6, 15.6], sway: 0.22 },
  { t: [0.6, 3.3, 0], p: [2.4, 5.2, 16.0], sway: 0.1 },
  { t: [0, CHIP_Y, 0.1], p: [0.16, CHIP_Y + 0.2, 0.86], sway: 0.14 },
  { t: [0.8, 3.6, 0], p: [3.2, 5.6, 15.4], sway: 0.08 },
  QCAM, QCAM, QCAM, QCAM,
];
let camFromP = camera.position.clone(), camFromT = controls.target.clone();
const tmpP = new THREE.Vector3(), tmpT = new THREE.Vector3();
function updateCamera(tp) {
  if (userCam) return;
  const k = CAM[curPhase];
  const target = V(...k.t);
  const off = V(...k.p).sub(target);
  off.applyAxisAngle(UP, k.sway * Math.sin(tp * 0.45));
  const dur = curPhase === 0 ? 2.4 : 1.8;
  const e = ease(tp / dur);
  tmpT.copy(camFromT).lerp(target, e);
  tmpP.copy(camFromP).lerp(target.clone().add(off), e);
  camera.position.copy(tmpP); controls.target.copy(tmpT);
}

/* ============================================================
   画面（パネル・ステップ）
   ============================================================ */
const stepsEl = $('steps');
const stepEls = PH.map((p, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'step';
  b.innerHTML = `<i>${i + 1}</i><span>${p.short}</span><div class="bar"></div>`;
  b.addEventListener('click', () => { T = starts[i] + 0.001; enterPhase(i); });
  stepsEl.appendChild(b); return b;
});
let T = 0, paused = false, curPhase = -1;
const qs = new URLSearchParams(location.search);
if (qs.has('t')) T = clamp(parseFloat(qs.get('t')) || 0, 0, TOTAL - 0.01);
$('pauseBtn').addEventListener('click', () => { paused = !paused; $('pauseBtn').textContent = paused ? '再生' : '一時停止'; });
if (qs.has('pause')) { paused = true; $('pauseBtn').textContent = '再生'; }

function enterPhase(i) {
  curPhase = i;
  const p = PH[i];
  $('nowNum').textContent = `${i + 1} / ${PH.length}`;
  $('nowName').textContent = p.name;
  $('cardTitle').innerHTML = p.title;
  $('cardText').innerHTML = p.text;
  stepEls.forEach((el, k) => { el.classList.toggle('cur', k === i); el.classList.toggle('done', k < i); el.querySelector('.bar').style.width = k < i ? '100%' : '0'; });
  const dev = i < 4;
  $('devInfo').style.display = dev ? 'flex' : 'none';
  $('qInfo').style.display = dev ? 'none' : 'flex';
  if (dev) $('devInfo').innerHTML = DEV_INFO[i];
  camFromP = camera.position.clone(); camFromT = controls.target.clone(); userCam = false;
  lineMats.forEach((m, k) => {
    let c = 0x000000, s = 0;
    if (i === 3) { if (k === ROLE.rin || k === ROLE.q0 || k === ROLE.q1) { c = 0x2f7dff; s = 0.9; } if (k === ROLE.rout) { c = 0xff7a1a; s = 0.9; } }
    if (i >= 4) { if (k === ROLE.q0 || k === ROLE.q1 || k === ROLE.rin) { c = 0x2f7dff; s = 0.5; } if (k === ROLE.rout) { c = 0xff7a1a; s = 0.5; } }
    m.emissive.setHex(c); m.emissiveIntensity = s;
  });
  if (i === 6 || !outcomes) makeOutcomes();
  for (const id in LAB) { LAB[id].h = 0; }
}

/* ============================================================
   毎フレームの更新
   ============================================================ */
const pulsesNow = [];
function travel(line, t0, dur, tp, up, color, size = 1) {
  if (tp < t0 || tp > t0 + dur) return;
  const u = (tp - t0) / dur;
  pulsesNow.push({ line, u: up ? 1 - u : u, color, size, up });
}
function schedulePulses(key, tp) {
  pulsesNow.length = 0;
  if (key === 'signal') {
    for (let s = 0.6; s < tp; s += 1.7) {
      travel(ROLE.rin, s, 1.5, tp, false, BLUE); travel(ROLE.q0, s + 0.4, 1.5, tp, false, BLUE); travel(ROLE.q1, s + 0.8, 1.5, tp, false, BLUE);
      travel(ROLE.rout, s + 1.4, 1.5, tp, true, ORANGE);
    }
  } else if (key === 'hgate') {
    travel(ROLE.q0, 0.1, 1.4, tp, false, BLUE, 1.2);
  } else if (key === 'cnot') {
    travel(ROLE.q0, 0.1, 1.4, tp, false, BLUE, 1.2); travel(ROLE.q1, 0.25, 1.3, tp, false, BLUE, 1.0);
  } else if (key === 'measure') {
    SLOW.forEach((s) => { travel(ROLE.rin, s - 0.55, 1.05, tp, false, BLUE, 1.1); travel(ROLE.rout, s + 0.5, 1.2, tp, true, ORANGE, 1.1); });
    for (let s = FAST_T0 - 0.6; s < FAST_T1 - 0.4; s += 0.3) { travel(ROLE.rin, s, 1.0, tp, false, BLUE, 0.9); travel(ROLE.rout, s + 1.0, 1.1, tp, true, ORANGE, 0.9); }
  }
}
function drawPulses() {
  let n = 0;
  const camPos = camera.position;
  for (const p of pulsesNow) {
    const curve = lineCurves[p.line];
    for (let k = 0; k < 5 && n < pulsePool.length; k++) {
      const u = p.u + (p.up ? 1 : -1) * k * 0.004;
      if (u < 0 || u > 1) continue;
      const s = pulsePool[n++];
      curve.getPointAt(u, s.position);
      const d = s.position.distanceTo(camPos);
      const sc = clamp(d * 0.028, 0.03, 0.42) * p.size * (1 - k * 0.16);
      s.scale.set(sc, sc, 1); s.material.color.copy(p.color); s.material.opacity = 1 - k * 0.18; s.visible = true;
    }
  }
  for (; n < pulsePool.length; n++) pulsePool[n].visible = false;
}

function describe(v) {
  const L = Math.hypot(v.x, v.y, v.z);
  if (L < 0.06) return ['中心（向きなし）', '長さ 0：単独では決まらない'];
  let where;
  if (v.z > 0.985 * L && L > 0.97) where = '北極 = ' + K('|0⟩');
  else if (v.z < -0.985 * L && L > 0.97) where = '南極 = ' + K('|1⟩');
  else if (Math.abs(v.z) < 0.03 && L > 0.97) where = '赤道 = 重ね合わせ';
  else where = L > 0.97 ? '回転中…' : '縮んでいく…';
  return [where, `矢印の長さ ${L.toFixed(2)}`];
}

let lastCountsKey = '';
function updateQuantum(key, tp) {
  let st = null, v0, v1, shotIdx = -1, collapse = 1, mode = 'prob', n = 0, line = '', gate = '';
  let trail0 = null, trail1 = null, axisOp = 0, ent = false;
  let x = 95;
  if (key === 'hgate') {
    const g = smooth((tp - 1.5) / 3.0);
    st = stH(g); gate = tp >= 1.2 ? 'H' : '';
    x = 95 + (133 - 95) * smooth((tp - 0.6) / 0.9);
    if (g > 0) { const pts = []; for (let k = 0; k <= 60; k++) pts.push(blochOf(stH(g * k / 60), 0)); trail0 = pts; }
    axisOp = smooth((tp - 1.0) / 0.5) * (1 - 0.6 * smooth((tp - 5.0) / 1));
    if (tp < 1.5) line = `はじめ：${K('|ψ⟩ = |00⟩')}（左が q0、右が q1）`;
    else if (g < 1) line = `H ゲート中：q0 を x と z の間の軸のまわりに回転`;
    else line = `${K('|ψ⟩ = (|00⟩ + |10⟩)/√2')}　q0 は重ね合わせ、q1 は ${K('|0⟩')}`;
  } else if (key === 'cnot') {
    const g = smooth((tp - 1.5) / 3.0);
    st = stCX(g); gate = tp >= 1.2 ? 'CX' : '';
    x = 133 + (205 - 133) * smooth((tp - 0.4) / 1.0);
    if (g > 0) { const p0 = [], p1 = []; for (let k = 0; k <= 60; k++) { const s = stCX(g * k / 60); p0.push(blochOf(s, 0)); p1.push(blochOf(s, 1)); } trail0 = p0; trail1 = p1; }
    ent = g > 0.98;
    if (tp < 1.5) line = `いま：${K('|ψ⟩ = (|00⟩ + |10⟩)/√2')}`;
    else if (g < 1) line = 'CNOT 中：q0 が 1 の部分だけ q1 が反転していく';
    else line = `${K('|ψ⟩ = (|00⟩ + |11⟩)/√2')}　量子もつれ：情報は 2 つの関係の中にある`;
  } else {
    x = key === 'measure' ? 205 + (280 - 205) * smooth(tp / 0.8) : 318;
    gate = 'M'; mode = 'count'; ent = key === 'measure' && tp < SLOW[0] + 0.5;
    if (key === 'measure') {
      n = shotsDone(tp);
      if (tp < SLOW[0]) { st = ST_BELL; mode = 'prob'; line = `${K('(|00⟩ + |11⟩)/√2')} を測定する`; }
      else if (tp < FAST_T0) {
        const k = SLOW.findIndex((s) => tp >= s && tp < s + 1.4);
        const kk = k < 0 ? n - 1 : k;
        const s0 = SLOW[kk];
        if (tp < s0 + 0.5) { st = ST_BELL; line = `${kk + 1} 回目：${K('|00⟩')} から H → CNOT をやり直し、測定中…`; ent = true; }
        else { shotIdx = kk; collapse = smooth((tp - s0 - 0.5) / 0.15); }
      } else {
        const nq = shotsDone(Math.floor(tp / 0.1) * 0.1);
        shotIdx = Math.max(0, nq - 1);
        if (tp < FAST_T1) line = `${n} 回目まで：毎回やり直して高速でくり返し中…`;
        else line = `${SHOTS} 回の測定が終わった`;
      }
    } else {
      n = SHOTS; shotIdx = SHOTS - 1;
    }
    if (shotIdx >= 0) {
      const o = outcomes[shotIdx], b0 = o >> 1, b1 = o & 1;
      v0 = { x: 0, y: 0, z: (b0 ? -1 : 1) * collapse }; v1 = { x: 0, y: 0, z: (b1 ? -1 : 1) * collapse };
      if (!line) line = `${shotIdx + 1} 回目の結果：q0 = ${b0}、q1 = ${b1} → <b>${b0}${b1}</b>　（2 つがそろう）`;
      $('out0').textContent = String(b0); $('out1').textContent = String(b1);
    } else { $('out0').textContent = '0 / 1'; $('out1').textContent = '0 / 1'; }
    if (key === 'summary') {
      const c = [0, 0, 0, 0]; for (let k = 0; k < SHOTS; k++) c[outcomes[k]]++;
      line = `00 が ${c[0]} 回、11 が ${c[3]} 回、01 と 10 は ${c[1] + c[2]} 回`;
    }
  }
  if (key === 'hgate' || key === 'cnot') { $('out0').textContent = '0 / 1'; $('out1').textContent = '0 / 1'; }
  if (st) { v0 = blochOf(st, 0); v1 = blochOf(st, 1); }

  setArrow(B[0], v0); setArrow(B[1], v1);
  [[B[0], v0], [B[1], v1]].forEach(([b, v]) => {
    const L = Math.hypot(v.x, v.y, v.z);
    b.dot.visible = L < 0.12;
    const pulse = 1 + 0.25 * Math.sin(performance.now() / 160);
    b.dot.scale.setScalar(pulse);
  });
  if (trail0) setTrail(B[0], trail0); else B[0].trailGeo.setDrawRange(0, 0);
  if (trail1) setTrail(B[1], trail1); else B[1].trailGeo.setDrawRange(0, 0);
  hAxis.visible = axisOp > 0.01; hAxis.material.opacity = axisOp * 0.9;
  hAxisLabel.visible = axisOp > 0.01; hAxisLabel.material.opacity = axisOp;
  $('entBadge').classList.toggle('show', ent);

  const d0 = describe(v0), d1 = describe(v1);
  setHTML($('cap0'), `<b>q0</b>${d0[0]}<br>${d0[1]}`);
  setHTML($('cap1'), `<b>q1</b>${d1[0]}<br>${d1[1]}`);
  setHTML($('stateLine'), line);
  $('playhead').setAttribute('x1', x); $('playhead').setAttribute('x2', x);
  $('gH').classList.toggle('on', gate === 'H'); $('gCX').classList.toggle('on', gate === 'CX'); $('gM').classList.toggle('on', gate === 'M');

  // 棒グラフ
  let vals, labels;
  if (mode === 'prob') {
    const p = probs(st || ST_BELL);
    vals = p; labels = p.map((q) => `${Math.round(q * 100)} %`);
    setHTML($('barsMode'), '各結果が出る<b>確率</b>（計算上）');
    setHTML($('barsCount'), '');
  } else {
    const c = [0, 0, 0, 0]; for (let k = 0; k < n; k++) c[outcomes[k]]++;
    vals = c.map((q) => q / SHOTS); labels = c.map((q) => `${q} 回`);
    setHTML($('barsMode'), '測定で出た<b>回数</b>');
    setHTML($('barsCount'), `測定回数 <b>${n}</b> / ${SHOTS}`);
  }
  const ck = mode + vals.map((q) => q.toFixed(4)).join(',');
  if (ck !== lastCountsKey) {
    lastCountsKey = ck;
    for (let k = 0; k < 4; k++) {
      $('bf' + k).style.width = (vals[k] * 100).toFixed(2) + '%';
      $('bv' + k).textContent = labels[k];
      $('be' + k).style.display = mode === 'count' && (k === 0 || k === 3) ? 'block' : 'none';
    }
  }

  // チップの光り方
  const gp = (a, b) => (tp > a && tp < b ? 0.6 + 0.4 * Math.sin(tp * 18) : 0);
  let g0 = 0, g1 = 0, gc = 0, gr = 0;
  if (key === 'hgate') g0 = gp(1.5, 4.5);
  if (key === 'cnot') { gc = gp(1.5, 4.5); g0 = gc * 0.6; g1 = gc; }
  if (key === 'measure') {
    SLOW.forEach((s) => { if (tp > s + 0.3 && tp < s + 0.8) gr = 1; });
    if (tp > FAST_T0 && tp < FAST_T1) gr = 0.6 + 0.4 * Math.sin(tp * 30);
  }
  return { g0, g1, gc, gr };
}

let lastT = performance.now();
let clockShown = '';
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (!paused) { T += dt; if (T >= TOTAL) T -= TOTAL; }
  let i = PH.length - 1; while (i > 0 && T < starts[i]) i--;
  if (i !== curPhase) enterPhase(i);
  const tp = T - starts[i];
  const key = PH[i].key;

  // 大きさの調整
  const w = viewEl.clientWidth, h = viewEl.clientHeight;
  const cv = renderer.domElement;
  if (cv.width !== Math.floor(w * renderer.getPixelRatio()) || cv.height !== Math.floor(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    for (const id in LAB) LAB[id].h = 0;
  }

  updateCamera(tp);
  controls.update();

  // 段の光（温度の段階）
  plateMats.forEach((m, k) => {
    let s = 0;
    if (key === 'temps') { const a = 0.5 + k * 1.1; if (tp > a) s = 0.12 + 0.55 * Math.exp(-(tp - a) * 1.6); }
    m.emissiveIntensity = s;
  });
  const ld = $('ladder');
  if (ld && key === 'temps') {
    [...ld.children].forEach((li, k) => { const a = 0.5 + k * 1.1, b = 0.5 + (k + 1) * 1.1; li.classList.toggle('on', tp > a); li.classList.toggle('cur', tp > a && (tp < b || k === 5)); });
  } else if (ld) { [...ld.children].forEach((li) => li.classList.add('on')); }

  // シールドの透け方・真空容器
  const shieldTarget = (key === 'overview' || key === 'temps' || key === 'signal') ? 1 : 0.12;
  shieldMat.opacity += (shieldTarget - shieldMat.opacity) * Math.min(1, dt * 4);
  shieldMat.depthWrite = shieldMat.opacity > 0.95;
  const canOp = key === 'overview' ? 0.28 * (1 - smooth((tp - 0.6) / 2.4)) : 0;
  canMat.opacity = canOp; cans.visible = canOp > 0.005;

  // 制御装置のランプ
  ledMats.forEach((m, k) => { const on = Math.sin(now / 1000 * (1.3 + (k % 5) * 0.7) + k * 1.7) > 0.2; m.color.setHex(on ? (k % 2 ? 0x45e07a : 0x4d9bff) : 0x1a2433); });

  // パルス
  schedulePulses(key, tp);
  drawPulses();

  // 量子の計算と右パネル
  let glow = { g0: 0, g1: 0, gc: 0, gr: 0 };
  if (i >= 4) glow = updateQuantum(key, tp);
  chipM.q0.emissiveIntensity = 0.25 + glow.g0 * 1.5;
  chipM.q1.emissiveIntensity = 0.25 + glow.g1 * 1.5;
  chipM.cpl.emissiveIntensity = glow.gc * 2;
  chipM.res.emissiveIntensity = glow.gr * 1.6;
  chipM.drv.emissiveIntensity = (key === 'chip' ? 0.6 : 0) + Math.max(glow.g0, glow.g1);
  chipGlow[0].material.opacity = glow.g0 * 0.9; chipGlow[1].material.opacity = glow.g1 * 0.9; chipGlow[2].material.opacity = glow.gc * 0.9;

  renderer.render(scene, camera);

  if (i >= 4) {
    const bw = bCanvas.clientWidth, bh = bCanvas.clientHeight;
    if (bw > 0 && bh > 0) {
      const pr = bRenderer.getPixelRatio();
      if (bCanvas.width !== Math.floor(bw * pr) || bCanvas.height !== Math.floor(bh * pr)) bRenderer.setSize(bw, bh, false);
      const half = bw / 2;
      bCam.aspect = half / bh;
      const dist = bCam.position.length();
      bCam.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.max(1.6 / dist, 1.55 / dist / bCam.aspect)));
      bCam.updateProjectionMatrix();
      bRenderer.setClearColor(0x000000, 0);
      for (let k = 0; k < 2; k++) {
        B[0].g.visible = k === 0; B[1].g.visible = k === 1;
        bRenderer.setViewport(k * half, 0, half, bh); bRenderer.setScissor(k * half, 0, half, bh);
        bRenderer.clear(); bRenderer.render(bScene, bCam);
      }
    }
  }

  layoutLabels(tp, dt);

  const cs = `${Math.floor(T)} 秒 / ${TOTAL} 秒`;
  if (cs !== clockShown) { clockShown = cs; $('clock').textContent = cs; }
  stepEls[i].querySelector('.bar').style.width = (100 * tp / PH[i].dur).toFixed(1) + '%';
}
requestAnimationFrame(frame);
if (qs.has('debug')) window.__qc = { THREE, camera, scene, fridge, chip, STAGES, controls };
</script>
</body>
</html>
